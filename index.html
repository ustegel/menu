<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FBF9F6">
    <title>Üstəgəl Menu</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        stg: {
                            base: '#FBF9F6',        // logo arxa fonu
                            surface: '#F3EDE6',     // yumşaq krem
                            card: '#FFFFFF',
                            ink: '#3B1F12',         // logo yazısı (tünd espresso)
                            textSecondary: '#8A5A30', // tagline qəhvəyisi
                            textMuted: '#A8927F',
                            caramel: '#8A5A30',
                            danger: '#B3402F',
                            success: '#5E8B4E',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FBF9F6;
            color: #3B1F12;
            -webkit-font-smoothing: antialiased;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel {
            background-color: #FFFFFF;
            border: 1px solid rgba(59, 31, 18, 0.10);
            border-radius: 16px;
            box-shadow: 0 1px 2px rgba(59, 31, 18, 0.04);
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        .glass-panel:hover {
            background-color: #FDF9F4;
            box-shadow: 0 4px 14px rgba(59, 31, 18, 0.08);
        }

        .input-field {
            background-color: #FFFFFF;
            border: 1px solid rgba(59, 31, 18, 0.18);
            color: #3B1F12;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .input-field::placeholder { color: #A8927F; }
        .input-field:focus {
            outline: none;
            border-color: #4A2514;
            box-shadow: 0 0 0 3px rgba(74, 37, 20, 0.12);
        }

        .btn-primary, .btn-success {
            background: linear-gradient(to right, #6B3A20, #4A2514);
            color: #FFFFFF;
            border-radius: 100px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(74, 37, 20, 0.30);
        }
        .btn-primary:hover, .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 37, 20, 0.40);
        }

        .btn-icon {
            background-color: rgba(59, 31, 18, 0.07);
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        .btn-icon:hover { background-color: rgba(59, 31, 18, 0.15); }

        #order-modal-content::-webkit-scrollbar { width: 6px; }
        #order-modal-content::-webkit-scrollbar-track { background: #F3EDE6; }
        #order-modal-content::-webkit-scrollbar-thumb { background: #C9B5A3; border-radius: 10px; }

        .category-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(251, 249, 246, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 31, 18, 0.10);
        }
        .category-link {
            border-bottom: 2px solid transparent;
        }
        .category-link.active {
            color: #3B1F12;
            border-bottom: 2px solid #8A5A30;
            font-weight: 600;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background-color: #FFFFFF;
            border: 1px solid rgba(59, 31, 18, 0.18);
            color: #3B1F12;
            cursor: pointer;
            transition: all 0.15s;
        }
        .qty-btn:hover { background-color: #F3EDE6; }
        .qty-btn:active {
            background-color: #4A2514;
            color: #FFFFFF;
            border-color: #4A2514;
        }

        .logo-wrap {
            width: 100%;
            max-width: 32rem;
            aspect-ratio: 16 / 5.5;
            overflow: hidden;
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 42%;
            mix-blend-mode: multiply;
        }

        /* Qəbz */
        .receipt-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(59, 31, 18, 0.10);
            box-shadow: 0 10px 40px rgba(59, 31, 18, 0.18);
        }
        .receipt-divider {
            border-top: 2px dashed rgba(59, 31, 18, 0.20);
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-24 relative selection:bg-stg-ink selection:text-white">

    <!-- Header / Logo -->
    <header class="pt-6 pb-2 px-4 flex justify-center items-center">
        <div class="logo-wrap">
            <!-- logo.png faylını index.html ilə eyni qovluğa yüklə. Tapılmasa köhnə link işləyəcək -->
            <img src="logo.png"
                 onerror="this.onerror=null;this.src='https://docs.google.com/drawings/d/e/2PACX-1vQYSOAxXzzVbRkPp6AyyWePdIWyiYBa335CM_Q9oB8zsiCmic62aCJ9QrKmh0KDyvLDZw599M52M4XE/pub?w=960&h=720';"
                 alt="Üstəgəl Logo">
        </div>
    </header>

    <!-- Loading State -->
    <div id="loader" class="flex flex-col items-center justify-center py-20">
        <div class="w-10 h-10 border-4 border-stg-surface border-t-stg-ink rounded-full animate-spin mb-4"></div>
        <p class="text-stg-textSecondary">Menyu yüklənir...</p>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="hidden w-full max-w-3xl mx-auto px-4">
        <nav id="category-nav" class="category-nav flex overflow-x-auto gap-6 py-4 mb-6 -mx-4 px-4 scrollbar-hide snap-x"></nav>
        <div id="menu-container" class="space-y-10"></div>
    </main>

    <!-- Floating 'Sifariş ver' Button -->
    <div id="fab-container" class="fixed bottom-6 left-0 right-0 px-4 flex justify-center z-40 opacity-0 transform translate-y-10 transition-all duration-500 pointer-events-none">
        <button id="open-order-btn" class="btn-primary w-full max-w-md py-4 px-6 flex justify-between items-center text-lg pointer-events-auto">
            <span>Sifariş ver</span>
            <span id="fab-total" class="bg-white text-stg-ink px-3 py-1 rounded-full text-sm font-bold">0.00 ₼</span>
        </button>
    </div>

    <!-- Order Modal -->
    <div id="order-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 backdrop-blur-sm" style="background: rgba(59,31,18,0.55);" id="modal-backdrop"></div>

        <div class="absolute bottom-0 left-0 right-0 bg-stg-card rounded-t-3xl border-t border-stg-ink/10 max-h-[90vh] flex flex-col transform transition-transform duration-300 translate-y-full" id="order-modal-sheet" style="box-shadow: 0 -10px 40px rgba(59,31,18,0.15);">

            <div class="flex justify-between items-center p-6 border-b border-stg-ink/10">
                <h2 class="font-display text-xl font-bold text-stg-ink">Sifarişiniz</h2>
                <button id="close-modal-btn" class="btn-icon w-8 h-8 flex items-center justify-center text-stg-textSecondary" aria-label="Bağla">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto" id="order-modal-content">
                <div class="space-y-4 mb-8">
                    <div>
                        <label class="block text-sm font-medium text-stg-textSecondary mb-2">Masa No <span class="text-stg-danger">*</span></label>
                        <input type="number" id="table-no" class="input-field w-full p-3" placeholder="Məs: 12" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stg-textSecondary mb-2">Adınız <span class="text-stg-danger">*</span></label>
                        <input type="text" id="customer-name" class="input-field w-full p-3" placeholder="Adınızı daxil edin" maxlength="100" required>
                    </div>
                </div>

                <h3 class="font-display text-lg font-semibold text-stg-ink mb-4">Seçilmiş Məhsullar</h3>
                <div id="order-summary-list" class="space-y-3 mb-6"></div>

                <div class="flex justify-between items-center py-4 border-t border-stg-ink/10 mt-4">
                    <span class="text-stg-textSecondary font-medium">Ümumi Məbləğ:</span>
                    <span id="modal-total" class="font-display text-2xl font-bold text-stg-ink">0.00 ₼</span>
                </div>
            </div>

            <div class="p-6 border-t border-stg-ink/10 bg-stg-surface">
                <button id="submit-order-btn" class="btn-success w-full py-4 text-lg flex justify-center items-center gap-2">
                    <span>Təsdiq Et</span>
                    <i class="fas fa-check-circle"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Receipt Overlay (Sifariş uğurla göndərildi + qəbz) -->
    <div id="receipt-overlay" class="fixed inset-0 z-[60] hidden overflow-y-auto" style="background: rgba(59,31,18,0.65);">
        <div class="min-h-full flex items-center justify-center p-4">
            <div class="receipt-card w-full max-w-md p-6">

                <div class="text-center mb-5">
                    <div class="w-14 h-14 rounded-full mx-auto mb-3 flex items-center justify-center" style="background: rgba(94,139,78,0.12);">
                        <i class="fas fa-check-circle text-stg-success text-3xl"></i>
                    </div>
                    <h2 class="font-display text-xl font-bold text-stg-ink" id="receipt-title">Sifariş uğurla göndərildi!</h2>
                </div>

                <div class="receipt-divider mb-4"></div>

                <div class="mb-1 text-center">
                    <div class="font-display font-bold text-stg-ink tracking-wide">Üstəgəl</div>
                    <div class="text-xs text-stg-textMuted mt-1">Sifariş qəbzi</div>
                </div>

                <div class="text-sm space-y-1 my-4">
                    <div class="flex justify-between"><span class="text-stg-textSecondary">Tarix:</span><span class="font-medium text-stg-ink" id="receipt-date"></span></div>
                    <div class="flex justify-between"><span class="text-stg-textSecondary">Masa No:</span><span class="font-medium text-stg-ink" id="receipt-table"></span></div>
                    <div class="flex justify-between gap-4"><span class="text-stg-textSecondary">Ad:</span><span class="font-medium text-stg-ink text-right break-words" id="receipt-name"></span></div>
                </div>

                <div class="receipt-divider mb-4"></div>

                <div id="receipt-items" class="space-y-3 mb-4"></div>

                <div class="receipt-divider mb-4"></div>

                <div class="flex justify-between items-center mb-5">
                    <span class="font-display font-semibold text-stg-ink">Yekun məbləğ:</span>
                    <span id="receipt-total" class="font-display text-2xl font-bold text-stg-ink">0.00 ₼</span>
                </div>

                <div class="rounded-xl p-4 text-center mb-5 bg-stg-surface border border-stg-ink/10">
                    <p class="text-sm text-stg-ink leading-relaxed">Qəbzi telefonunuzda saxlayın və zəhmət olmasa, yekunda ödəniş üçün kassaya yaxınlaşın.</p>
                    <p class="font-display font-bold text-stg-caramel mt-2">Nuş olsun!</p>
                </div>

                <button id="close-receipt-btn" class="btn-primary w-full py-3 text-base">Bağla</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // KONFİQURASİYA: Apps Script Web App URL-i
        // =====================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbxQ8M164evYBaxzVnWfHxo2hIfEc5Jls16NMJNPo537IWwCqLSLOTSqocI0nxtFAKdJ4Q/exec';

        // State
        let menuData = {};
        let cart = {}; // { "Item Name": { price: 5, quantity: 2 } }

        // DOM
        const loader = document.getElementById('loader');
        const mainContent = document.getElementById('main-content');
        const menuContainer = document.getElementById('menu-container');
        const categoryNav = document.getElementById('category-nav');

        const fabContainer = document.getElementById('fab-container');
        const fabTotal = document.getElementById('fab-total');
        const openOrderBtn = document.getElementById('open-order-btn');

        const orderModal = document.getElementById('order-modal');
        const orderModalSheet = document.getElementById('order-modal-sheet');
        const orderSummaryList = document.getElementById('order-summary-list');
        const modalTotal = document.getElementById('modal-total');
        const submitOrderBtn = document.getElementById('submit-order-btn');

        const tableNoInput = document.getElementById('table-no');
        const customerNameInput = document.getElementById('customer-name');

        const receiptOverlay = document.getElementById('receipt-overlay');

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        function safeId(name) {
            return name.replace(/[^a-zA-Z0-9]/g, '_');
        }
        function pad2(n) { return String(n).padStart(2, '0'); }
        function formatDate(d) {
            return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear() +
                   ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMenu();

            openOrderBtn.addEventListener('click', openOrderModal);
            submitOrderBtn.addEventListener('click', submitOrder);
            document.getElementById('modal-backdrop').addEventListener('click', closeOrderModal);
            document.getElementById('close-modal-btn').addEventListener('click', closeOrderModal);
            document.getElementById('close-receipt-btn').addEventListener('click', closeReceipt);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeOrderModal();
            });
        });

        // ---------------- API ----------------
        async function fetchMenu() {
            try {
                const res = await fetch(API_URL + '?action=menu');
                if (!res.ok) throw new Error('Server cavabı: ' + res.status);
                const response = await res.json();
                handleMenuData(response);
            } catch (err) {
                handleError(err.message || err);
            }
        }

        async function sendOrder(orderData) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(orderData)
            });
            if (!res.ok) throw new Error('Server cavabı: ' + res.status);
            return res.json();
        }

        // ---------------- Render ----------------
        function handleMenuData(response) {
            loader.style.display = 'none';
            if (response.success) {
                menuData = response.data;
                renderMenu();
                mainContent.classList.remove('hidden');
            } else {
                handleError(response.error);
            }
        }

        function handleError(error) {
            loader.style.display = 'flex';
            loader.innerHTML = `
                <div class="text-stg-danger text-center p-6 glass-panel">
                    <i class="fas fa-exclamation-triangle text-3xl mb-3"></i>
                    <p>Xəta baş verdi. Zəhmət olmasa səhifəni yeniləyin.</p>
                    <p class="text-sm mt-2 opacity-70">${escapeHtml(error)}</p>
                </div>
            `;
        }

        function setActiveLink(link) {
            document.querySelectorAll('.category-link').forEach(l => l.classList.remove('active'));
            link.classList.add('active');
        }

        function renderMenu() {
            menuContainer.innerHTML = '';
            categoryNav.innerHTML = '';

            const categories = Object.keys(menuData);

            if (categories.length === 0) {
                menuContainer.innerHTML = '<p class="text-center text-stg-textSecondary">Menyuda məhsul tapılmadı.</p>';
                return;
            }

            categories.forEach((category, index) => {
                // Nav link
                const navLink = document.createElement('a');
                navLink.href = `#cat-${index}`;
                navLink.className = `category-link whitespace-nowrap px-1 py-2 font-medium text-sm transition-colors text-stg-textSecondary ${index === 0 ? 'active' : ''}`;
                navLink.textContent = category;

                navLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    setActiveLink(navLink);
                    const targetElement = document.getElementById(navLink.getAttribute('href').substring(1));
                    const y = targetElement.getBoundingClientRect().top + window.pageYOffset - 80;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                });

                categoryNav.appendChild(navLink);

                // Section
                const section = document.createElement('div');
                section.id = `cat-${index}`;
                section.className = 'scroll-mt-24';

                const catTitle = document.createElement('h2');
                catTitle.className = 'font-display text-2xl font-bold text-stg-ink mb-4 border-b border-stg-ink/15 pb-2';
                catTitle.textContent = category;
                section.appendChild(catTitle);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-3';

                menuData[category].forEach(item => {
                    const itemCard = document.createElement('div');
                    itemCard.className = 'glass-panel p-4 flex justify-between items-center';

                    itemCard.innerHTML = `
                        <div class="flex-1 pr-4">
                            <h3 class="font-medium text-stg-ink text-lg leading-tight">${escapeHtml(item.name)}</h3>
                            <p class="text-stg-caramel font-bold mt-1 font-display">${item.price.toFixed(2)} ₼</p>
                        </div>
                        <div class="flex items-center gap-3 bg-stg-surface p-1 rounded-xl border border-stg-ink/10">
                            <button type="button" class="qty-btn btn-minus" aria-label="Azalt">
                                <i class="fas fa-minus text-xs"></i>
                            </button>
                            <span id="qty-${safeId(item.name)}" class="w-6 text-center font-bold text-stg-ink">${cart[item.name] ? cart[item.name].quantity : 0}</span>
                            <button type="button" class="qty-btn btn-plus" aria-label="Artır">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    `;

                    itemCard.querySelector('.btn-minus').addEventListener('click', () => updateCart(item.name, item.price, -1));
                    itemCard.querySelector('.btn-plus').addEventListener('click', () => updateCart(item.name, item.price, 1));

                    grid.appendChild(itemCard);
                });

                section.appendChild(grid);
                menuContainer.appendChild(section);
            });

            setupScrollSpy();
        }

        // ---------------- Cart ----------------
        function updateCart(itemName, price, change) {
            if (!cart[itemName]) {
                if (change < 0) return;
                cart[itemName] = { price: price, quantity: 0 };
            }

            cart[itemName].quantity += change;
            if (cart[itemName].quantity <= 0) delete cart[itemName];

            updateUI(itemName);
        }

        function updateUI(itemName) {
            const qtyElement = document.getElementById(`qty-${safeId(itemName)}`);

            if (qtyElement) {
                qtyElement.textContent = cart[itemName] ? cart[itemName].quantity : 0;
                qtyElement.parentElement.classList.add('scale-105', 'bg-white');
                setTimeout(() => qtyElement.parentElement.classList.remove('scale-105', 'bg-white'), 200);
            }

            let total = 0;
            let totalItems = 0;
            for (const item in cart) {
                total += cart[item].price * cart[item].quantity;
                totalItems += cart[item].quantity;
            }

            const formattedTotal = total.toFixed(2) + ' ₼';
            fabTotal.textContent = formattedTotal;
            modalTotal.textContent = formattedTotal;

            if (totalItems > 0) {
                fabContainer.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
            } else {
                fabContainer.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                if (!orderModal.classList.contains('hidden')) closeOrderModal();
            }
        }

        // ---------------- Modal ----------------
        function openOrderModal() {
            orderSummaryList.innerHTML = '';

            for (const [itemName, details] of Object.entries(cart)) {
                const itemTotal = (details.price * details.quantity).toFixed(2);

                const row = document.createElement('div');
                row.className = 'flex justify-between items-center p-3 bg-stg-surface rounded-xl border border-stg-ink/10';
                row.innerHTML = `
                    <div class="flex-1">
                        <h4 class="text-stg-ink font-medium text-sm">${escapeHtml(itemName)}</h4>
                        <div class="text-stg-textMuted text-xs mt-1">${details.price.toFixed(2)} ₼ x ${details.quantity}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-stg-caramel">${itemTotal} ₼</div>
                    </div>
                `;
                orderSummaryList.appendChild(row);
            }

            orderModal.classList.remove('hidden');
            setTimeout(() => orderModalSheet.classList.remove('translate-y-full'), 10);
            fabContainer.style.display = 'none';
        }

        function closeOrderModal() {
            if (orderModal.classList.contains('hidden')) return;
            orderModalSheet.classList.add('translate-y-full');
            setTimeout(() => {
                orderModal.classList.add('hidden');
                fabContainer.style.display = 'flex';
            }, 300);
        }

        // ---------------- Receipt ----------------
        function showReceipt(order) {
            document.getElementById('receipt-date').textContent = formatDate(order.date);
            document.getElementById('receipt-table').textContent = order.tableNo;
            document.getElementById('receipt-name').textContent = order.customerName;

            const list = document.getElementById('receipt-items');
            list.innerHTML = '';
            order.items.forEach(it => {
                const lineTotal = (it.price * it.quantity).toFixed(2);
                const row = document.createElement('div');
                row.className = 'flex justify-between items-start gap-3 text-sm';
                row.innerHTML = `
                    <div class="flex-1">
                        <div class="font-medium text-stg-ink">${escapeHtml(it.name)}</div>
                        <div class="text-xs text-stg-textMuted mt-0.5">${it.price.toFixed(2)} ₼ x ${it.quantity}</div>
                    </div>
                    <div class="font-bold text-stg-caramel whitespace-nowrap">${lineTotal} ₼</div>
                `;
                list.appendChild(row);
            });

            document.getElementById('receipt-total').textContent = order.total.toFixed(2) + ' ₼';

            receiptOverlay.classList.remove('hidden');
            receiptOverlay.scrollTop = 0;
            document.body.style.overflow = 'hidden';
        }

        function closeReceipt() {
            receiptOverlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        // ---------------- Submit ----------------
        async function submitOrder() {
            const tableNo = tableNoInput.value.trim();
            const customerName = customerNameInput.value.trim();

            if (!tableNo || !customerName) {
                alert('Zəhmət olmasa Masa No və Adınızı daxil edin.');

                if (!tableNo) tableNoInput.classList.add('border-stg-danger');
                if (!customerName) customerNameInput.classList.add('border-stg-danger');

                setTimeout(() => {
                    tableNoInput.classList.remove('border-stg-danger');
                    customerNameInput.classList.remove('border-stg-danger');
                }, 2000);
                return;
            }

            const orderItems = Object.entries(cart).map(([name, d]) => ({
                name: name,
                quantity: d.quantity
            }));

            const orderData = {
                tableNo: tableNo,
                customerName: customerName,
                items: orderItems
            };

            // Qəbz üçün səbətin surəti (resetApp-dan əvvəl)
            const receiptItems = Object.entries(cart).map(([name, d]) => ({
                name: name,
                price: d.price,
                quantity: d.quantity
            }));
            const localTotal = receiptItems.reduce((s, i) => s + i.price * i.quantity, 0);

            const originalBtnHtml = submitOrderBtn.innerHTML;
            submitOrderBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Göndərilir...';
            submitOrderBtn.disabled = true;
            submitOrderBtn.classList.add('opacity-70');

            try {
                const response = await sendOrder(orderData);
                if (response.success) {
                    const receipt = {
                        date: new Date(),
                        tableNo: tableNo,
                        customerName: customerName,
                        items: receiptItems,
                        total: (typeof response.total === 'number') ? response.total : localTotal
                    };
                    closeOrderModal();
                    showReceipt(receipt);
                    resetApp();
                } else {
                    alert('Xəta baş verdi: ' + response.error);
                }
            } catch (err) {
                alert('Sistem xətası: ' + (err.message || err));
            } finally {
                submitOrderBtn.innerHTML = originalBtnHtml;
                submitOrderBtn.disabled = false;
                submitOrderBtn.classList.remove('opacity-70');
            }
        }

        function resetApp() {
            cart = {};
            document.querySelectorAll('span[id^="qty-"]').forEach(el => { el.textContent = '0'; });
            updateUI('');
            tableNoInput.value = '';
            customerNameInput.value = '';
        }

        // ---------------- Scroll spy ----------------
        function setupScrollSpy() {
            const sections = document.querySelectorAll('#menu-container > div[id^="cat-"]');
            const navLinks = document.querySelectorAll('.category-link');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('id');
                        navLinks.forEach(link => {
                            if (link.getAttribute('href') === `#${id}`) {
                                setActiveLink(link);
                                const navContainer = document.getElementById('category-nav');
                                navContainer.scrollLeft = link.offsetLeft - (navContainer.offsetWidth / 2) + (link.offsetWidth / 2);
                            }
                        });
                    }
                });
            }, { root: null, rootMargin: '-100px 0px -60% 0px', threshold: 0 });

            sections.forEach(section => observer.observe(section));
        }
    </script>
