<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üstəgəl Menu</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        stg: {
                            base: '#090C14',
                            surface: '#0F1320',
                            card: '#141929',
                            cardHover: '#1A2035',
                            textPrimary: '#F0F4FF',
                            textSecondary: '#8B97B4',
                            textMuted: '#4A5568',
                            blue: '#4F8EF7',
                            cyan: '#22D4E0',
                            violet: '#8B5CF6',
                            rose: '#F43F5E',
                            amber: '#F59E0B',
                            emerald: '#10B981',
                        }
                    },
                    backgroundImage: {
                        'gradient-primary': 'linear-gradient(to right, #4F8EF7, #22D4E0)',
                        'gradient-success': 'linear-gradient(to right, #10B981, #06B6D4)',
                    },
                    boxShadow: {
                        'glow-primary': '0 0 30px rgba(79,142,247,0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #090C14;
            color: #F0F4FF;
            -webkit-font-smoothing: antialiased;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel {
            background-color: #141929;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
        }
        .glass-panel:hover { background-color: #1A2035; }

        .input-field {
            background-color: #0F1320;
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #F0F4FF;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #4F8EF7;
            box-shadow: 0 0 0 2px rgba(79,142,247,0.2);
        }

        .btn-primary {
            background: linear-gradient(to right, #4F8EF7, #22D4E0);
            color: white;
            border-radius: 100px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(79, 142, 247, 0.39);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 142, 247, 0.5);
        }

        .btn-success {
            background: linear-gradient(to right, #10B981, #06B6D4);
            color: white;
            border-radius: 100px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        .btn-icon {
            background-color: rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        .btn-icon:hover { background-color: rgba(255, 255, 255, 0.15); }

        #order-modal-content::-webkit-scrollbar { width: 6px; }
        #order-modal-content::-webkit-scrollbar-track { background: #0F1320; }
        #order-modal-content::-webkit-scrollbar-thumb { background: #4A5568; border-radius: 10px; }

        .category-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(9, 12, 20, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        .category-link.active {
            color: #4F8EF7;
            border-bottom: 2px solid #4F8EF7;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background-color: #0F1320;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #F0F4FF;
            cursor: pointer;
        }
        .qty-btn:active {
            background-color: #4F8EF7;
            color: white;
            border-color: #4F8EF7;
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-24 relative selection:bg-stg-blue selection:text-white">

    <!-- Header / Logo -->
    <header class="pt-8 pb-6 px-4 flex justify-center items-center flex-col">
        <div class="w-full max-w-sm bg-white p-4 rounded-2xl shadow-glow-primary mb-4 flex justify-center">
            <img src="https://docs.google.com/drawings/d/e/2PACX-1vQYSOAxXzzVbRkPp6AyyWePdIWyiYBa335CM_Q9oB8zsiCmic62aCJ9QrKmh0KDyvLDZw599M52M4XE/pub?w=960&h=720"
                 alt="Üstəgəl Logo"
                 class="h-20 object-contain mix-blend-multiply">
        </div>
        <p class="text-stg-textSecondary font-medium text-sm uppercase tracking-widest">Coffee • Events • Games</p>
    </header>

    <!-- Loading State -->
    <div id="loader" class="flex flex-col items-center justify-center py-20">
        <div class="w-10 h-10 border-4 border-stg-surface border-t-stg-blue rounded-full animate-spin mb-4"></div>
        <p class="text-stg-textSecondary">Menyu yüklənir...</p>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="hidden w-full max-w-3xl mx-auto px-4">
        <nav id="category-nav" class="category-nav flex overflow-x-auto gap-6 py-4 mb-6 -mx-4 px-4 scrollbar-hide snap-x"></nav>
        <div id="menu-container" class="space-y-10"></div>
    </main>

    <!-- Floating 'Sifariş ver' Button -->
    <div id="fab-container" class="fixed bottom-6 left-0 right-0 px-4 flex justify-center z-40 opacity-0 transform translate-y-10 transition-all duration-500 pointer-events-none">
        <button id="open-order-btn" class="btn-primary w-full max-w-md py-4 px-6 flex justify-between items-center text-lg shadow-2xl pointer-events-auto">
            <span>Sifariş ver</span>
            <span id="fab-total" class="bg-white text-stg-base px-3 py-1 rounded-full text-sm font-bold">0.00 ₼</span>
        </button>
    </div>

    <!-- Order Modal -->
    <div id="order-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" id="modal-backdrop"></div>

        <div class="absolute bottom-0 left-0 right-0 bg-stg-card rounded-t-3xl border-t border-white/10 max-h-[90vh] flex flex-col transform transition-transform duration-300 translate-y-full" id="order-modal-sheet">

            <div class="flex justify-between items-center p-6 border-b border-white/10">
                <h2 class="font-display text-xl font-bold text-white">Sifarişiniz</h2>
                <button id="close-modal-btn" class="btn-icon w-8 h-8 flex items-center justify-center text-stg-textSecondary">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto" id="order-modal-content">
                <div class="space-y-4 mb-8">
                    <div>
                        <label class="block text-sm font-medium text-stg-textSecondary mb-2">Masa No <span class="text-stg-rose">*</span></label>
                        <input type="number" id="table-no" class="input-field w-full p-3" placeholder="Məs: 12" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stg-textSecondary mb-2">Adınız <span class="text-stg-rose">*</span></label>
                        <input type="text" id="customer-name" class="input-field w-full p-3" placeholder="Adınızı daxil edin" maxlength="100" required>
                    </div>
                </div>

                <h3 class="font-display text-lg text-white mb-4">Seçilmiş Məhsullar</h3>
                <div id="order-summary-list" class="space-y-3 mb-6"></div>

                <div class="flex justify-between items-center py-4 border-t border-white/10 mt-4">
                    <span class="text-stg-textSecondary font-medium">Ümumi Məbləğ:</span>
                    <span id="modal-total" class="font-display text-2xl font-bold text-stg-cyan">0.00 ₼</span>
                </div>
            </div>

            <div class="p-6 border-t border-white/10 bg-stg-surface">
                <button id="submit-order-btn" class="btn-success w-full py-4 text-lg flex justify-center items-center gap-2">
                    <span>Təsdiq Et</span>
                    <i class="fas fa-check-circle"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Success Toast -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-stg-card border border-stg-emerald text-white px-6 py-3 rounded-full shadow-lg z-50 flex items-center gap-3 transition-all duration-300 -translate-y-20 opacity-0">
        <i class="fas fa-check-circle text-stg-emerald text-xl"></i>
        <span class="font-medium" id="toast-message">Sifariş uğurla göndərildi!</span>
    </div>

    <script>
        // =====================================================
        // KONFİQURASİYA: Apps Script Web App URL-i
        // =====================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbxQ8M164evYBaxzVnWfHxo2hIfEc5Jls16NMJNPo537IWwCqLSLOTSqocI0nxtFAKdJ4Q/exec';

        // State
        let menuData = {};
        let cart = {}; // { "Item Name": { price: 5, quantity: 2 } }

        // DOM
        const loader = document.getElementById('loader');
        const mainContent = document.getElementById('main-content');
        const menuContainer = document.getElementById('menu-container');
        const categoryNav = document.getElementById('category-nav');

        const fabContainer = document.getElementById('fab-container');
        const fabTotal = document.getElementById('fab-total');
        const openOrderBtn = document.getElementById('open-order-btn');

        const orderModal = document.getElementById('order-modal');
        const orderModalSheet = document.getElementById('order-modal-sheet');
        const orderSummaryList = document.getElementById('order-summary-list');
        const modalTotal = document.getElementById('modal-total');
        const submitOrderBtn = document.getElementById('submit-order-btn');

        const tableNoInput = document.getElementById('table-no');
        const customerNameInput = document.getElementById('customer-name');

        // HTML escape (menyudakı adlar innerHTML-ə düşməsin)
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        function safeId(name) {
            return name.replace(/[^a-zA-Z0-9]/g, '_');
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMenu();

            openOrderBtn.addEventListener('click', openOrderModal);
            submitOrderBtn.addEventListener('click', submitOrder);
            document.getElementById('modal-backdrop').addEventListener('click', closeOrderModal);
            document.getElementById('close-modal-btn').addEventListener('click', closeOrderModal);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeOrderModal();
            });
        });

        // ---------------- API ----------------
        async function fetchMenu() {
            try {
                const res = await fetch(API_URL + '?action=menu');
                if (!res.ok) throw new Error('Server cavabı: ' + res.status);
                const response = await res.json();
                handleMenuData(response);
            } catch (err) {
                handleError(err.message || err);
            }
        }

        async function sendOrder(orderData) {
            // Content-Type: text/plain -> CORS preflight (OPTIONS) tələb olunmur
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(orderData)
            });
            if (!res.ok) throw new Error('Server cavabı: ' + res.status);
            return res.json();
        }

        // ---------------- Render ----------------
        function handleMenuData(response) {
            loader.style.display = 'none';
            if (response.success) {
                menuData = response.data;
                renderMenu();
                mainContent.classList.remove('hidden');
            } else {
                loader.style.display = 'flex';
                handleError(response.error);
            }
        }

        function handleError(error) {
            loader.style.display = 'flex';
            loader.innerHTML = `
                <div class="text-stg-rose text-center p-6 glass-panel">
                    <i class="fas fa-exclamation-triangle text-3xl mb-3"></i>
                    <p>Xəta baş verdi. Zəhmət olmasa səhifəni yeniləyin.</p>
                    <p class="text-sm mt-2 opacity-70">${escapeHtml(error)}</p>
                </div>
            `;
        }

        function renderMenu() {
            menuContainer.innerHTML = '';
            categoryNav.innerHTML = '';

            const categories = Object.keys(menuData);

            if (categories.length === 0) {
                menuContainer.innerHTML = '<p class="text-center text-stg-textSecondary">Menyuda məhsul tapılmadı.</p>';
                return;
            }

            categories.forEach((category, index) => {
                // Nav link
                const navLink = document.createElement('a');
                navLink.href = `#cat-${index}`;
                navLink.className = `category-link whitespace-nowrap px-1 py-2 font-medium text-sm transition-colors ${index === 0 ? 'active' : 'text-stg-textSecondary'}`;
                navLink.textContent = category;

                navLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.category-link').forEach(l => l.classList.remove('active', 'text-white'));
                    navLink.classList.add('active', 'text-white');
                    navLink.classList.remove('text-stg-textSecondary');

                    const targetElement = document.getElementById(navLink.getAttribute('href').substring(1));
                    const y = targetElement.getBoundingClientRect().top + window.pageYOffset - 80;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                });

                categoryNav.appendChild(navLink);

                // Section
                const section = document.createElement('div');
                section.id = `cat-${index}`;
                section.className = 'scroll-mt-24';

                const catTitle = document.createElement('h2');
                catTitle.className = 'font-display text-2xl font-bold text-white mb-4 border-b border-white/10 pb-2';
                catTitle.textContent = category;
                section.appendChild(catTitle);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-3';

                menuData[category].forEach(item => {
                    const itemCard = document.createElement('div');
                    itemCard.className = 'glass-panel p-4 flex justify-between items-center';

                    itemCard.innerHTML = `
                        <div class="flex-1 pr-4">
                            <h3 class="font-medium text-stg-textPrimary text-lg leading-tight">${escapeHtml(item.name)}</h3>
                            <p class="text-stg-blue font-bold mt-1 font-display">${item.price.toFixed(2)} ₼</p>
                        </div>
                        <div class="flex items-center gap-3 bg-stg-base p-1 rounded-xl border border-white/5">
                            <button type="button" class="qty-btn btn-minus" aria-label="Azalt">
                                <i class="fas fa-minus text-xs"></i>
                            </button>
                            <span id="qty-${safeId(item.name)}" class="w-6 text-center font-bold text-white">${cart[item.name] ? cart[item.name].quantity : 0}</span>
                            <button type="button" class="qty-btn btn-plus" aria-label="Artır">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    `;

                    itemCard.querySelector('.btn-minus').addEventListener('click', () => updateCart(item.name, item.price, -1));
                    itemCard.querySelector('.btn-plus').addEventListener('click', () => updateCart(item.name, item.price, 1));

                    grid.appendChild(itemCard);
                });

                section.appendChild(grid);
                menuContainer.appendChild(section);
            });

            setupScrollSpy();
        }

        // ---------------- Cart ----------------
        function updateCart(itemName, price, change) {
            if (!cart[itemName]) {
                if (change < 0) return;
                cart[itemName] = { price: price, quantity: 0 };
            }

            cart[itemName].quantity += change;
            if (cart[itemName].quantity <= 0) delete cart[itemName];

            updateUI(itemName);
        }

        function updateUI(itemName) {
            const qtyElement = document.getElementById(`qty-${safeId(itemName)}`);

            if (qtyElement) {
                qtyElement.textContent = cart[itemName] ? cart[itemName].quantity : 0;
                qtyElement.parentElement.classList.add('scale-105', 'bg-stg-surface');
                setTimeout(() => qtyElement.parentElement.classList.remove('scale-105', 'bg-stg-surface'), 200);
            }

            let total = 0;
            let totalItems = 0;
            for (const item in cart) {
                total += cart[item].price * cart[item].quantity;
                totalItems += cart[item].quantity;
            }

            const formattedTotal = total.toFixed(2) + ' ₼';
            fabTotal.textContent = formattedTotal;
            modalTotal.textContent = formattedTotal;

            if (totalItems > 0) {
                fabContainer.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
            } else {
                fabContainer.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                if (!orderModal.classList.contains('hidden')) closeOrderModal();
            }
        }

        // ---------------- Modal ----------------
        function openOrderModal() {
            orderSummaryList.innerHTML = '';

            for (const [itemName, details] of Object.entries(cart)) {
                const itemTotal = (details.price * details.quantity).toFixed(2);

                const row = document.createElement('div');
                row.className = 'flex justify-between items-center p-3 bg-stg-base rounded-xl border border-white/5';
                row.innerHTML = `
                    <div class="flex-1">
                        <h4 class="text-white font-medium text-sm">${escapeHtml(itemName)}</h4>
                        <div class="text-stg-textMuted text-xs mt-1">${details.price.toFixed(2)} ₼ x ${details.quantity}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-stg-cyan">${itemTotal} ₼</div>
                    </div>
                `;
                orderSummaryList.appendChild(row);
            }

            orderModal.classList.remove('hidden');
            setTimeout(() => orderModalSheet.classList.remove('translate-y-full'), 10);
            fabContainer.style.display = 'none';
        }

        function closeOrderModal() {
            if (orderModal.classList.contains('hidden')) return;
            orderModalSheet.classList.add('translate-y-full');
            setTimeout(() => {
                orderModal.classList.add('hidden');
                fabContainer.style.display = 'flex';
            }, 300);
        }

        // ---------------- Submit ----------------
        async function submitOrder() {
            const tableNo = tableNoInput.value.trim();
            const customerName = customerNameInput.value.trim();

            if (!tableNo || !customerName) {
                alert('Zəhmət olmasa Masa No və Adınızı daxil edin.');

                if (!tableNo) tableNoInput.classList.add('border-stg-rose');
                if (!customerName) customerNameInput.classList.add('border-stg-rose');

                setTimeout(() => {
                    tableNoInput.classList.remove('border-stg-rose');
                    customerNameInput.classList.remove('border-stg-rose');
                }, 2000);
                return;
            }

            const orderItems = Object.entries(cart).map(([name, d]) => ({
                name: name,
                quantity: d.quantity
            }));

            const orderData = {
                tableNo: tableNo,
                customerName: customerName,
                items: orderItems
            };

            const originalBtnHtml = submitOrderBtn.innerHTML;
            submitOrderBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Göndərilir...';
            submitOrderBtn.disabled = true;
            submitOrderBtn.classList.add('opacity-70');

            try {
                const response = await sendOrder(orderData);
                if (response.success) {
                    closeOrderModal();
                    showToast();
                    resetApp();
                } else {
                    alert('Xəta baş verdi: ' + response.error);
                }
            } catch (err) {
                alert('Sistem xətası: ' + (err.message || err));
            } finally {
                submitOrderBtn.innerHTML = originalBtnHtml;
                submitOrderBtn.disabled = false;
                submitOrderBtn.classList.remove('opacity-70');
            }
        }

        function resetApp() {
            cart = {};
            document.querySelectorAll('span[id^="qty-"]').forEach(el => { el.textContent = '0'; });
            updateUI('');
            tableNoInput.value = '';
            customerNameInput.value = '';
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        // ---------------- Scroll spy ----------------
        function setupScrollSpy() {
            const sections = document.querySelectorAll('#menu-container > div[id^="cat-"]');
            const navLinks = document.querySelectorAll('.category-link');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('id');
                        navLinks.forEach(link => {
                            if (link.getAttribute('href') === `#${id}`) {
                                navLinks.forEach(l => l.classList.remove('active', 'text-white'));
                                link.classList.add('active', 'text-white');
                                link.classList.remove('text-stg-textSecondary');

                                const navContainer = document.getElementById('category-nav');
                                navContainer.scrollLeft = link.offsetLeft - (navContainer.offsetWidth / 2) + (link.offsetWidth / 2);
                            }
                        });
                    }
                });
            }, { root: null, rootMargin: '-100px 0px -60% 0px', threshold: 0 });

            sections.forEach(section => observer.observe(section));
        }
    </script>
</body>

</html>
